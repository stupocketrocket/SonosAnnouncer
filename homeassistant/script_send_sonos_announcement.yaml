# Home Assistant script: script.send_sonos_announcement
#
# Reads the helper entities defined in helpers.yaml and publishes one MQTT
# message on sonosannouncer/announce/cmd matching the payload schema the
# ESP32 firmware expects (see ../README.md, "MQTT topic/payload schema").
#
# To install: Settings -> Automations & Scenes -> Scripts -> "+" -> skip the
# visual editor via the "..." menu -> "Edit in YAML" -> paste this in (minus
# this comment block) -> Save.
alias: Send Sonos Announcement
sequence:
  - variables:
      selected_speakers: >-
        {% set names = [] %}
        {% if is_state('input_boolean.announce_garden', 'on') %}{% set names = names + ['Garden'] %}{% endif %}
        {% if is_state('input_boolean.announce_kitchen', 'on') %}{% set names = names + ['Kitchen'] %}{% endif %}
        {% if is_state('input_boolean.announce_living_room', 'on') %}{% set names = names + ['Living Room'] %}{% endif %}
        {% if is_state('input_boolean.announce_main_bedroom', 'on') %}{% set names = names + ['Main Bedroom'] %}{% endif %}
        {% if is_state('input_boolean.announce_office', 'on') %}{% set names = names + ['Office'] %}{% endif %}
        {% if is_state('input_boolean.announce_charlotte_s_bedroom', 'on') %}{% set names = names + ["Charlotte's Bedroom"] %}{% endif %}
        {{ names }}
  - choose:
      - conditions: "{{ is_state('input_boolean.announce_all_speakers', 'on') }}"
        sequence:
          - action: mqtt.publish
            data:
              topic: sonosannouncer/announce/cmd
              payload: >-
                {{ {'text': states('input_text.announcement_message'), 'volume': states('input_number.announcement_volume') | int, 'speakers': 'all'} | to_json }}
    default:
      - action: mqtt.publish
        data:
          topic: sonosannouncer/announce/cmd
          payload: >-
            {{ {'text': states('input_text.announcement_message'), 'volume': states('input_number.announcement_volume') | int, 'speakers': selected_speakers} | to_json }}
mode: single
